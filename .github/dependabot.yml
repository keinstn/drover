version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # FlutterFire plugins pin an exact firebase-ios-sdk version, so bumping
    # them one at a time leaves conflicting Swift package requirements.
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_functions*"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
