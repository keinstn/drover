name: ci-flutter

on:
  pull_request:
    paths:
      - "app/**"
      - "justfile"
      - ".github/workflows/ci-flutter.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # flutter_soloud's native-assets build hook compiles its Linux ALSA
      # backend during `flutter test`, so the headers must exist on the runner.
      - name: Install ALSA headers for flutter_soloud
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/.fvmrc
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
